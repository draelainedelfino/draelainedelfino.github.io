<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Prontuário · Dra. Elaine Delfino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Agenda à esquerda, calendário à direita; prontuário abre numa gaveta lateral com abas */
  /* Identidade de clínica dermatológica: sempre clara, branco com dourado (sem modo escuro, por escolha) */
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --surface-2: #fcfbf8;
    --stripe: #f4f1ea;
    --border: #ece7dc;
    --border-strong: #dcd3c1;
    --text: #2a2620;
    --muted: #7b7366;
    --faint: #a89f8f;
    --out: #d3cbbb;
    --accent: #a8843f;
    --accent-soft: #f7f0e1;
    --accent-ink: #7a5c22;
    --btn: #96752f;
    --btn-hover: #7a5c22;
    --on-accent: #ffffff;
    --gold-line: linear-gradient(90deg, #c9a75e, #e8d39c 50%, #b08b45);
    --danger: #b9473e;
    --danger-soft: #fbeeec;
    --good: #3f7d4e;
    --good-soft: #e9f3ea;
    --warn: #8f630f;
    --warn-soft: #fbf1dc;
    --ink: #96752f;
    --on-ink: #ffffff;
    --scrim: rgba(42,38,32,.28);
    --toast-bg: #2a2620;
    --toast-fg: #ffffff;
    --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(90,70,30,.04), 0 1px 3px rgba(90,70,30,.06);
    --shadow-lg: 0 20px 40px -12px rgba(90,70,30,.18);
    color-scheme: light;
  }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--gold-line); }
  h1 { font-family: var(--display); font-weight: 600 !important; letter-spacing: 0 !important; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg { width: 18px; height: 18px; flex: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Barras de rolagem discretas; com a gaveta ou uma janela aberta, a página de trás não rola */
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-button { display: none; }
  html.travado, html.travado body { overflow: hidden; }

  /* Header */
  header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
  .bar { max-width: 1180px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 32px; }
  .brand { display: flex; align-items: center; gap: 7px; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .02em; color: var(--accent-ink); flex: none; }
  .brand-mark { width: 22px; height: 22px; border-radius: 50%; background: var(--gold-line); color: var(--on-accent); display: grid; place-items: center; }
  .brand-mark svg { width: 13px; height: 13px; }
  .brand { gap: 10px; }
  .avatar.foto { width: 42px; height: 42px; object-fit: cover; padding: 0; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px #c9a75e; }
  .brand-logo { width: 52px; height: 52px; object-fit: contain; display: block; }
  nav { display: flex; gap: 6px; }
  nav button { border: 0; background: none; padding: 11px 18px; border-radius: 10px; cursor: pointer; color: var(--muted); font-weight: 550; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  nav button svg { width: 21px; height: 21px; }
  nav button:hover { background: var(--bg); color: var(--text); }
  nav button.active { background: var(--accent-soft); color: var(--accent-ink); }
  .who { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }

  /* Barra fixa no rodapé com o botão Salvar */
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 12px rgba(16,24,40,.06); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .savebar-in { max-width: 1132px; margin: 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  .savebar-in .sub { margin: 0; text-align: right; }
  .btn.save { padding: 10px 26px; font-weight: 600; justify-content: center; min-width: 150px; }
  .btn.save.err { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  @media (max-width: 600px) { .savebar-in { justify-content: space-between; } .btn.save { flex: 1; max-width: 220px; } }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; letter-spacing: -.02em; margin: 0; font-weight: 650; text-wrap: balance; }
  h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-body { padding: 20px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); background: var(--surface); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--btn); border-color: var(--btn); color: var(--on-accent); }
  .btn.primary:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
  .btn.ghost { border-color: transparent; background: none; }
  .btn.ghost:hover { background: var(--bg); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn:disabled { opacity: .35; cursor: default; }

  /* Forms */
  label.f { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .input, select.input, textarea.input { width: 100%; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 9px; padding: 9px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea.input { resize: vertical; min-height: 76px; line-height: 1.55; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }

  /* Agenda */
  .agenda { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  .daynav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .slot { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border); min-height: 60px; }
  .slot:last-child { border-bottom: 0; }
  .slot .time { font-weight: 600; font-variant-numeric: tabular-nums; }
  .slot.free .time { color: var(--faint); font-weight: 500; }
  .slot.free .add { opacity: 0; color: var(--accent); font-weight: 500; font-size: 13px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 4px 0; }
  .slot.free:hover { background: var(--surface-2); }
  .slot.free:hover .add, .slot.free .add:focus-visible { opacity: 1; }
  .slot.break { background: repeating-linear-gradient(135deg, var(--surface-2) 0 8px, var(--stripe) 8px 16px); color: var(--faint); font-size: 13px; min-height: 44px; }
  .appt { display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; }
  .appt .name { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt:hover .name { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .bar-l { width: 3px; align-self: stretch; border-radius: 3px; }
  .done-pill { font-size: 11px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }
  .slot-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .slot:hover .slot-actions, .slot-actions:focus-within { opacity: 1; }
  .empty-day { padding: 40px 20px; text-align: center; color: var(--muted); }

  .banner { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 18px; margin-bottom: 20px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); color: var(--accent-ink); }
  .banner > div { flex: 1; min-width: 220px; }
  .banner .sub { color: var(--accent-ink); opacity: .85; }

  /* Calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .cal-head b { font-weight: 600; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 6px 12px 14px; text-align: center; }
  .cal .wd { font-size: 11px; color: var(--faint); font-weight: 600; padding: 6px 0; }
  .cal button { border: 0; background: none; height: 36px; border-radius: 8px; cursor: pointer; font-variant-numeric: tabular-nums; position: relative; }
  .cal button:hover { background: var(--bg); }
  .cal button.out { color: var(--out); }
  .cal button.off { color: var(--faint); }
  .cal button.today { color: var(--accent); font-weight: 700; }
  .cal button.sel { background: var(--btn); color: var(--on-accent); font-weight: 600; }
  .cal button.has::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
  .cal button.sel.has::after { background: var(--on-accent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .stat { padding: 14px 16px; }
  .stat .n { font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .legend { padding: 14px 16px; display: grid; gap: 8px; margin-top: 12px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  td { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  .search { position: relative; width: 300px; max-width: 100%; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 16px; height: 16px; }
  .search .input { padding-left: 34px; }
  .pname { display: flex; align-items: center; gap: 12px; font-weight: 550; }

  /* Drawer & modal */
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--surface); z-index: 50; box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .drawer.open { transform: none; }
  .d-head { padding: 22px 28px 0; border-bottom: 1px solid var(--border); }
  .d-top { display: flex; align-items: flex-start; gap: 14px; }
  .d-top .avatar { width: 44px; height: 44px; font-size: 15px; }
  .d-meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .alerta { margin-top: 6px; color: var(--danger); font-size: 13px; }
  .tabs { display: flex; gap: 22px; margin-top: 18px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { border: 0; background: none; padding: 10px 0 12px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button.active { color: var(--text); border-color: var(--accent); }
  .count { font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 99px; padding: 0 7px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .d-body { flex: 1; overflow: auto; padding: 24px 28px; }
  .d-foot { padding: 14px 28px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; background: var(--surface-2); }
  .d-foot:empty { display: none; }
  .field-block { margin-bottom: 18px; }
  .field-block label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }

  .timeline { display: grid; gap: 14px; }
  .rec { border: 1px solid var(--border); border-radius: var(--radius); }
  .rec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0; }
  .rec-head .d { font-weight: 600; }
  .rec-head .m { color: var(--muted); font-size: 12px; }
  .rec-body { padding: 14px 16px; display: grid; gap: 10px; }
  .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .acts { display: flex; gap: 2px; flex: none; }

  /* Prescrição */
  .rx { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .rx-l { display: flex; gap: 8px; align-items: baseline; }
  .rx-l .i { color: var(--faint); font-variant-numeric: tabular-nums; width: 16px; flex: none; }
  .rx-l b { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .rx-q { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; padding-left: 12px; }
  .rx-p { color: var(--muted); font-size: 13px; margin-top: 2px; padding-left: 24px; white-space: pre-wrap; }
  .rx-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 12px; }
  .rx-item-head { display: flex; align-items: center; justify-content: space-between; margin: -4px -6px -4px 0; }
  .rx-g { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
  .rx-form { display: grid; gap: 14px; }

  /* Fotos */
  .drop { border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; cursor: pointer; color: var(--muted); transition: background .15s, border-color .15s; }
  .drop svg { width: 24px; height: 24px; color: var(--accent); margin-bottom: 4px; }
  .drop b { color: var(--text); font-weight: 600; }
  .drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--accent-soft); }
  .nota { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 18px; }
  .foto { margin: 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .foto-img { padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; aspect-ratio: 1; max-width: 100%; width: 100%; background: var(--stripe); cursor: zoom-in; display: block; }
  .foto-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto.pend .foto-img { display: grid; place-items: center; color: var(--muted); font-size: 13px; cursor: default; }
  .foto .input { padding: 6px 9px; font-size: 13px; }
  .foto .sub { font-size: 12px; margin: 0 2px; }

  .modal { position: fixed; left: 50%; top: 50%; width: min(520px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; transform: translate(-50%, -48%) scale(.98); opacity: 0; pointer-events: none; transition: .18s; z-index: 60; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); }
  .modal.open { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
  .modal.wide { width: min(980px, calc(100% - 32px)); }
  .modal-foot { padding: 14px 20px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); }
  .scrim.top { z-index: 55; }
  .lb { position: relative; background: var(--stripe); display: grid; place-items: center; min-height: 240px; }
  .lb img { max-height: 68vh; max-width: 100%; display: block; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
  .lb-nav.prev { left: 12px; } .lb-nav.next { right: 12px; }

  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .days label { display: inline-flex; }
  .days input { position: absolute; opacity: 0; pointer-events: none; }
  .days span { border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
  .days input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .days input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; }

  .tpl-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .tpl { padding: 18px 20px; cursor: pointer; transition: border-color .15s; }
  .tpl:hover { border-color: var(--accent); }
  .tpl ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }

  .estado { max-width: 460px; margin: 60px auto; text-align: center; padding: 32px 28px; }
  .estado h1 { font-size: 19px; margin-bottom: 6px; }

  .toast { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--toast-bg); color: var(--toast-fg); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: .2s; z-index: 80; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* Financeiro: folha de Controle de Caixa */
  .folha { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px 36px 22px; max-width: 1000px; margin: 0 auto; }
  .folha-tit { text-align: center; margin-bottom: 24px; }
  .folha-tit h2 { font-family: var(--display); font-size: 30px; font-weight: 600; letter-spacing: .06em; color: var(--text); margin-bottom: 4px; }
  .folha-tit div { color: var(--muted); font-size: 13px; }
  .folha-info { display: flex; justify-content: space-between; gap: 12px 32px; flex-wrap: wrap; margin-bottom: 20px; font-size: 14px; }
  .folha-info label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .folha-info input, .folha-obs textarea { border: 0; border-bottom: 1px solid var(--border-strong); background: transparent; padding: 4px 2px; outline: none; color: var(--text); font: inherit; }
  .folha-info input:focus, .folha-obs textarea:focus { border-color: var(--accent); }
  #cxResp { width: 260px; max-width: 100%; }
  table.cx { min-width: 760px; border: 1px solid var(--border-strong); }
  table.cx th { background: var(--ink); color: var(--on-ink); font-size: 12px; font-weight: 600; text-align: center; padding: 11px 8px; border: 0; }
  table.cx th.n { width: 46px; }
  table.cx th.w { width: 112px; }
  table.cx td { padding: 0; border: 1px solid var(--border); height: 36px; }
  table.cx tbody tr { cursor: default; }
  table.cx tbody tr:hover { background: none; }
  table.cx tbody tr:nth-child(odd) td { background: var(--stripe); }
  table.cx td.n { text-align: center; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  table.cx input { width: 100%; height: 35px; border: 0; background: transparent; padding: 0 10px; outline: none; font-size: 13.5px; }
  table.cx input:focus { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent); }
  table.cx .r { text-align: right; font-variant-numeric: tabular-nums; }
  table.cx td.tot { padding: 0 10px; font-weight: 600; }
  .folha-sec { font-family: var(--display); font-size: 19px; font-weight: 600; margin: 24px 0 12px; letter-spacing: .05em; }
  .fech { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .fech div { background: var(--stripe); border-radius: 10px; padding: 12px 14px; text-align: center; display: grid; gap: 6px; min-width: 0; }
  .fech span { font-size: 12px; font-weight: 600; color: var(--muted); }
  .fech b { font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fech .geral { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .fech .geral span { color: var(--accent-ink); letter-spacing: .03em; }
  .folha-obs { display: flex; gap: 8px; align-items: flex-start; margin-top: 18px; color: var(--muted); font-size: 14px; }
  .folha-obs textarea { flex: 1; resize: vertical; min-height: 44px; line-height: 1.6; }
  .folha-rod { text-align: center; color: var(--faint); font-size: 12px; margin-top: 22px; }
  .pill { border: 0; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.pago { background: var(--good-soft); color: var(--good); }
  .pill.pendente { background: var(--warn-soft); color: var(--warn); }
  /* Telas de acesso */
  .login { max-width: 400px; margin: 48px auto; padding: 32px 30px; text-align: center; }
  .login .grid { text-align: left; }
  .login h1 { font-size: 26px; margin-bottom: 18px; }
  .login .btn.primary { justify-content: center; padding: 11px; }
  .login-logo { width: 84px; height: 84px; object-fit: contain; margin: 0 auto 6px; display: block; }
  .login-links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .lnk { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .btn.sair { padding: 6px 10px; font-size: 13px; color: var(--muted); }
  .savebar[hidden] { display: none !important; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 10px; padding: 3px; gap: 3px; background: var(--surface-2); flex-wrap: wrap; }
  .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .fin-tot { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
  .fin-tot b { display: block; font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) {
    .folha { padding: 22px 14px 18px; }
    .folha-tit h2 { font-size: 24px; }
    .fech { grid-template-columns: 1fr 1fr; }
    .agenda { grid-template-columns: 1fr; }
    .who span { display: none; }
    nav button span { display: none; }
    nav button { padding: 11px 13px; }
    .brand span { display: none; }
    .bar { gap: 16px; padding: 0 16px; }
    main { padding: 20px 16px 48px; }
    .g2, .g3, .rx-g { grid-template-columns: 1fr; }
    .slot-actions { opacity: 1; }
    .slot.free .add { opacity: 1; }
    .hide-sm { display: none; }
    td, th { padding-left: 14px; padding-right: 14px; }
    .d-head { padding: 18px 16px 0; }
    .d-body { padding: 20px 16px; }
    .d-foot { padding: 12px 16px; }
    .slot { padding: 12px 14px; gap: 10px; grid-template-columns: 56px 1fr auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

// ---------- Utilidades ----------
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());
const clone = o => JSON.parse(JSON.stringify(o));

const pac = id => S.pacientes.find(p => p.id === id);

const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const toHM = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const fmtDate = (s, opts) => parseISO(s).toLocaleDateString('pt-BR', opts || { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtLongo = s => fmtDate(s, { day: '2-digit', month: 'long', year: 'numeric' });
const idade = n => { if (!n) return ''; const b = parseISO(n), t = new Date(); let a = t.getFullYear()-b.getFullYear(); if (t < new Date(t.getFullYear(), b.getMonth(), b.getDate())) a--; return a + ' anos'; };
const slug = s => String(s || 'paciente').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'paciente';

const emAndamento = new Set();
let ultimoSalvo = null, erroSalvar = false;
function acompanhar(p) {
  const t = p.then(() => { ultimoSalvo = new Date(); erroSalvar = false; }, e => { erroSalvar = true; falha(e); })
    .finally(() => { emAndamento.delete(t); statusSalvar(); });

// ---------- Dados guardados neste computador (IndexedDB do navegador) ----------
// Nada sai do computador: o site no GitHub só entrega as telas.
const BANCO = 'prontuario-dra-elaine';
let idb = null;
let perfil = null;
const ehAdmin = () => !!perfil && perfil.papel === 'admin';
function abrirBanco() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(BANCO, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('fotos'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function noBanco(loja, modo, fn) {
  return new Promise((res, rej) => {
    const t = idb.transaction(loja, modo), req = fn(t.objectStore(loja));
    t.oncomplete = () => res(req && req.result);
    t.onerror = t.onabort = () => rej(t.error || new Error('falha no banco do navegador'));
  });
}
const chave = (col, id) => `${col}/${id}`;
const avisando = r => { avisarAbas(); return r; };
function gravar(col, obj) { const { id, ...dados } = obj; return acompanhar(noBanco('docs', 'readwrite', s => s.put({ colecao: col, id: String(id), dados: clone(dados) }, chave(col, id))).then(avisando)); }
function apagar(col, id) { return acompanhar(noBanco('docs', 'readwrite', s => s.delete(chave(col, id))).then(avisando)); }
function gravarConfig() { return gravar('config', Object.assign({ id: 'geral' }, S.settings)); }

function aplicar(row) {
  if (!row || !row.colecao) return;
  if (row.colecao === 'config') { if (row.id === 'geral') S.settings = mesclarSettings(row.dados); return; }
  const arr = S[row.colecao]; if (!Array.isArray(arr)) return;
  const obj = Object.assign(clone(row.dados || {}), { id: row.id }), i = arr.findIndex(x => x.id === row.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
}

async function iniciar() {
  try {
    idb = await abrirBanco();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
    COLS.forEach(c => { S[c] = []; });
    (await noBanco('docs', 'readonly', s => s.getAll())).forEach(aplicar);
    if (!S.modelos.length) {
      [['clinico', 'Atendimento clínico geral', ['Queixa principal','Sintomas relatados','Exame físico','Medicação prescrita','Exames solicitados','Diagnóstico']],
       ['retorno', 'Retorno', ['Evolução','Resultado de exames','Conduta']],
       ['livre', 'Evolução livre', ['Evolução']]].forEach(([id, nome, campos]) => { const m = { id, nome, campos }; S.modelos.push(m); gravar('modelos', m); });
    }
  } catch (e) { console.error(e); estado = 'semnavegador'; return render(); }
  assets = {
    upload: async blob => { const id = uid() + uid(); await noBanco('fotos', 'readwrite', s => s.put(blob, id)); return { id }; },
    delete: async id => { await noBanco('fotos', 'readwrite', s => s.delete(id)); if (urlsFoto[id]) URL.revokeObjectURL(urlsFoto[id]); delete urlsFoto[id]; },
  };
  downloads = {
    save: async ({ filename, data }) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
      a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      return { status: 'saved' };
    },
  };
  // Outra aba aberta no mesmo computador também salvou: recarrega os dados
  try { canalAbas = new BroadcastChannel(BANCO); canalAbas.onmessage = () => recarregar(); } catch {}
  decidirAcesso();
}
let canalAbas = null, tAviso = null;
async function recarregar() {
  const linhas = await noBanco('docs', 'readonly', s => s.getAll());
  COLS.forEach(c => { S[c] = []; }); linhas.forEach(aplicar); aoMudar();
}
// Avisa as outras abas um pouco depois da última gravação
const avisarAbas = () => { clearTimeout(tAviso); tAviso = setTimeout(() => { try { canalAbas && canalAbas.postMessage(1); } catch {} }, 400); };

// Fotos: guardadas como arquivo no navegador e exibidas por um endereço local
const urlsFoto = {}, pedidas = new Set();
function fotoSrc(id) {
  if (id in urlsFoto) return urlsFoto[id];
  if (!pedidas.has(id)) {
    pedidas.add(id);
    noBanco('fotos', 'readonly', s => s.get(id)).then(b => {
      urlsFoto[id] = b ? URL.createObjectURL(b) : '';
      if (drawerPac && drawerTab === 'fotos') abrirProntuario(drawerPac, drawerConsulta, 'fotos');
      if (lightbox && lightbox.lista[lightbox.i].asset === id) verFoto(lightbox.lista[lightbox.i].id);
    });
  }
  return '';
}

const SESSAO = 'prontuario.sessao', INATIVO_MIN = 30;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function hashSenha(senha, saltB64) {
  const salt = saltB64 ? Uint8Array.from(atob(saltB64), c => c.charCodeAt(0)) : crypto.getRandomValues(new Uint8Array(16));
  const chaveBase = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, chaveBase, 256);
  return { salt: b64(salt), hash: b64(bits) };
}
async function senhaConfere(u, senha) { return (await hashSenha(senha, u.salt)).hash === u.hash; }
const acharUsuario = email => S.usuarios.find(u => u.email === String(email || '').trim().toLowerCase());

function decidirAcesso() {

  if (u) return abrirSessao(u);

}
function abrirSessao(u) {

// Restaura uma cópia de segurança (ou os dados trazidos do prontuário do Claude)
async function importar(d, comConfig) {
  const itens = ['pacientes','consultas','registros','prescricoes','caixa'].flatMap(c => (Array.isArray(d[c]) ? d[c] : []).filter(x => x && x.id).map(x => [c, x]));
  const nomes = new Set(S.modelos.map(m => String(m.nome).toLowerCase()));
  (d.modelos || []).forEach(m => { if (m && m.id && !nomes.has(String(m.nome).toLowerCase())) { nomes.add(String(m.nome).toLowerCase()); itens.push(['modelos', m]); } });
  // Fotos só entram junto com o arquivo da imagem
  const arquivos = d.arquivosFotos || {};
  (d.fotos || []).forEach(f => { if (f && f.id && arquivos[f.asset]) itens.push(['fotos', f]); });
  // Contas da cópia entram sem substituir quem já existe neste computador
  (d.usuarios || []).forEach(u => { if (u && u.id && !acharUsuario(u.email)) itens.push(['usuarios', u]); });
  try {
    for (const [c, x] of itens) {
      if (c === 'fotos') { const b = await (await fetch(arquivos[x.asset])).blob(); await noBanco('fotos', 'readwrite', s => s.put(b, x.asset)); }
      await gravar(c, x);
      aplicar({ colecao: c, id: String(x.id), dados: (({ id, ...r }) => r)(x) });
    }
    if (comConfig && d.settings) { S.settings = mesclarSettings(d.settings); await gravarConfig(); }
  } catch (e) { falha(e); return false; }
  toast(`${itens.length} itens restaurados`);
  return true;
}

// ---------- Agenda ----------
function slotsDoDia(data) {
  const s = S.settings, out = [];
  const trabalha = s.dias.includes(parseISO(data).getDay());
  const doDia = S.consultas.filter(c => c.data === data);
  const horas = new Set(doDia.map(c => c.hora));
  if (trabalha) for (let m = toMin(s.inicio); m < toMin(s.fim); m += +s.duracao || 30) horas.add(toHM(m));
  doDia.forEach(c => out.push({ hora: c.hora, c }));
  horas.forEach(h => { if (!doDia.some(c => c.hora === h)) out.push({ hora: h }); });
  return { trabalha, itens: out.sort((a,b) => toMin(a.hora) - toMin(b.hora) || (a.pausa ? -1 : 0)) };
}

function calendario() {
  const [y, m] = mes.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const comConsulta = new Set(S.consultas.map(c => c.data));
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const s = iso(d), cls = [];
    if (d.getMonth() !== m-1) cls.push('out');
    else if (!S.settings.dias.includes(d.getDay())) cls.push('off');
    if (s === TODAY) cls.push('today');
    if (s === dia) cls.push('sel');
    if (comConsulta.has(s)) cls.push('has');
    cells += `<button class="${cls.join(' ')}" data-a="dia" data-d="${s}">${d.getDate()}</button>`;
  }
  const nomeMes = first.toLocaleDateString('pt-BR', { month: 'long' });
  const titulo = nomeMes[0].toUpperCase() + nomeMes.slice(1) + ' ' + y;
  return `<div class="cal-head">
      <button class="icon-btn" data-a="mprev" title="Mês anterior">${I.left}</button><b>${titulo}</b><button class="icon-btn" data-a="mnext" title="Próximo mês">${I.right}</button>
    </div>
    <div class="cal">${WD.map(w => `<div class="wd">${w[0]}</div>`).join('')}${cells}</div>`;
}

$('#view').addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  const mesDe = s => s.slice(0,7);
  if (a === 'hoje') { dia = TODAY; mes = mesDe(dia); }
  else if (a === 'prev') { dia = addDays(dia, -1); mes = mesDe(dia); }
  else if (a === 'next') { dia = addDays(dia, 1); mes = mesDe(dia); }
  else if (a === 'dia') { dia = el.dataset.d; mes = mesDe(dia); }
  else if (a === 'mprev' || a === 'mnext') { const [y,m] = mes.split('-').map(Number); mes = iso(new Date(y, m-1 + (a === 'mnext' ? 1 : -1), 1)).slice(0,7); }
  else if (a === 'novo') return modalAgendar(el.dataset.h);
  else if (a === 'abrir') { const c = S.consultas.find(c => c.id === id); return ehAdmin() ? abrirProntuario(c.pacienteId, c.id) : modalPaciente(c.pacienteId); }
  else if (a === 'status') { const c = S.consultas.find(c => c.id === id); c.status = c.status === 'atendido' ? 'agendado' : 'atendido'; gravar('consultas', c); }
  else if (a === 'cancelar') return confirmar('Cancelar este agendamento?', () => { S.consultas = S.consultas.filter(c => c.id !== id); apagar('consultas', id); render(); toast('Agendamento cancelado'); }, 'Cancelar agendamento');
  else if (a === 'legadoNao') { legadoOculto = true; }
  else if (a === 'legado') { const d = legado(); if (!d) return; el.disabled = true; importar(d, true).then(ok => { if (ok) { try { localStorage.setItem('prontuario.migrado', TODAY); } catch {} } render(); }); return; }
  else if (a === 'pagar') return pagarConsulta(id);
  else if (a === 'cxHoje') mudarDiaCaixa(TODAY);
  else if (a === 'cxPrev' || a === 'cxNext') mudarDiaCaixa(addDays(caixaDia, a === 'cxNext' ? 1 : -1));
  else if (a === 'cxLinha') { cxExtra += 5; }
  else if (a === 'cxPdf' || a === 'cxPrint') { salvarCaixa(); return pdfCaixa(a === 'cxPrint'); }
  else if (a === 'novopac') return modalPaciente();
  else if (a === 'pac') return ehAdmin() ? abrirProntuario(id) : modalPaciente(id);
  else if (a === 'modelo') return modalModelo(id);
  else if (a === 'salvarcfg') return salvarConfig();
  else return;
  render();
});

async function preparar(file) {
  const direto = /^image\/(jpeg|png|webp|gif)$/.test(file.type);
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { if (direto) return { blob: file, w: 0, h: 0 }; throw { code: 'unsupported_type' }; }
  const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  if (direto && k === 1 && file.size <= 3 * 1024 * 1024) return { blob: file, w: bmp.width, h: bmp.height };
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no({ code: 'invalid_request' }), 'image/jpeg', 0.88));
  return { blob, w: c.width, h: c.height };
}
const msgUpload = e => ({
  too_large: 'A imagem passa de 20 MB.',
  unsupported_type: 'Formato não suportado. Envie JPG, PNG ou WebP.',
  quota_or_state: 'O espaço para fotos deste prontuário acabou.',
  rate_limited: 'Muitos envios seguidos. Aguarde um pouco e tente de novo.',
})[e && e.code] || 'Não foi possível enviar a foto. Tente de novo.';

async function enviarFotos(pid, files) {
  if (!assets) return;

  let ok = 0;
  for (const file of files) {

    enviando[pid] = (enviando[pid] || 0) + 1; refrescar();
    try {
      const { blob, w, h } = await preparar(file);
      const r = await assets.upload(blob, { type: blob.type || 'image/jpeg' });
      const f = { id: uid(), pacienteId: pid, asset: r.id, legenda: '', data: TODAY, criadoEm: new Date().toISOString(), w, h };
      S.fotos.push(f); gravar('fotos', f); ok++;
    } catch (e) { console.error(e); toast(msgUpload(e), 'erro'); }
    enviando[pid]--; refrescar();
  }
  if (ok) toast(ok === 1 ? 'Foto adicionada' : `${ok} fotos adicionadas`);
}

// ---------- PDF ----------
async function salvarArquivo(nome, data, aviso) {
  if (!downloads) return toast('Download indisponível aqui. Abra o prontuário pelo claude.ai.', 'erro');
  try { await downloads.save({ filename: nome, data }); toast(aviso || 'Arquivo salvo'); }
  catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'Já há um download aguardando confirmação.' : 'Não foi possível salvar o arquivo.', 'erro'); }
}
function pdfBase(titulo) {
  if (!window.jspdf) { toast('O gerador de PDF não carregou. Recarregue a página.', 'erro'); return null; }
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const pf = S.settings.prof, W = 210, M = 20, ctx = { doc, W, M, y: 22 };
  doc.setTextColor(25, 30, 40);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
  doc.text(pf.nome || 'Profissional', W / 2, ctx.y, { align: 'center' }); ctx.y += 5.5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  [[pf.especialidade, pf.registro].filter(Boolean).join(' · '), pf.endereco, [pf.telefone, pf.social].filter(Boolean).join(' · ')]
    .filter(Boolean).forEach(l => { doc.text(l, W / 2, ctx.y, { align: 'center' }); ctx.y += 4.5; });
  ctx.y += 2; doc.setDrawColor(40); doc.setLineWidth(0.4); doc.line(M, ctx.y, W - M, ctx.y); ctx.y += 10;
  if (titulo) { doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(titulo, W / 2, ctx.y, { align: 'center' }); ctx.y += 10; }
  return ctx;
}
function pdfTexto(ctx, txt, o = {}) {
  const { doc, M, W } = ctx, size = o.size || 11, x = o.x || M;
  doc.setFont('helvetica', o.bold ? 'bold' : 'normal'); doc.setFontSize(size);
  doc.splitTextToSize(String(txt), W - M - x).forEach(l => { if (ctx.y > 272) { doc.addPage(); ctx.y = 22; } doc.text(l, x, ctx.y); ctx.y += size * 0.42; });
  ctx.y += o.gap ?? 1.5;
}
function pdfPaciente(ctx, p) { pdfTexto(ctx, `Paciente: ${p.nome}${p.nasc ? ' · ' + idade(p.nasc) : ''}`, { size: 11, gap: 7 }); }
function pdfAssinatura(ctx, data) {
  const { doc, W } = ctx, pf = S.settings.prof;
  let y = Math.max(ctx.y + 30, 240); if (y > 268) { doc.addPage(); y = 240; }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(fmtLongo(data), W / 2, y - 16, { align: 'center' });
  doc.setLineWidth(0.3); doc.line(W / 2 - 40, y, W / 2 + 40, y);
  doc.text(pf.nome || '', W / 2, y + 5, { align: 'center' });
  if (pf.registro) doc.text(pf.registro, W / 2, y + 9.5, { align: 'center' });
}
// Impressão: o PDF abre numa aba nova já com a janela de impressão; se o navegador
// bloquear a aba, o arquivo é baixado e a impressão abre quando ele for aberto.
const AVISO_IMPRIMIR = 'Abra o arquivo baixado: a janela de impressão abre sozinha.';
function concluirPdf(ctx, nome, imprimir) {
  if (imprimir) {
    ctx.doc.autoPrint({ variant: 'non-conform' });
    const url = URL.createObjectURL(ctx.doc.output('blob'));
    if (window.open(url, '_blank')) { setTimeout(() => URL.revokeObjectURL(url), 60000); return; }
    URL.revokeObjectURL(url);
  }
  salvarArquivo((imprimir ? 'imprimir-' : '') + nome, ctx.doc.output('blob'), imprimir ? AVISO_IMPRIMIR : '');
}
function pdfRegistro(r, imprimir) {
  if (!r) return;
  const ctx = pdfBase((r.modelo || 'Registro de atendimento').toUpperCase()); if (!ctx) return;
  const p = pac(r.pacienteId) || { nome: '—' };
  pdfPaciente(ctx, p);
  r.campos.forEach(c => { pdfTexto(ctx, c.rotulo.toUpperCase(), { size: 9.5, bold: true, gap: 1.2 }); pdfTexto(ctx, c.texto, { size: 11, gap: 5 }); });
  pdfAssinatura(ctx, r.data);
  concluirPdf(ctx, `prontuario-${slug(p.nome)}-${r.data}.pdf`, imprimir);
}
function pdfReceita(rx, imprimir) {
  if (!rx) return;
  const ctx = pdfBase('RECEITUÁRIO'); if (!ctx) return;
  const { doc, M, W } = ctx, p = pac(rx.pacienteId) || { nome: '—' };
  pdfPaciente(ctx, p);
  const grupos = {}; rx.itens.forEach(i => (grupos[i.via || 'Uso oral'] = grupos[i.via || 'Uso oral'] || []).push(i));
  let n = 0;
  Object.entries(grupos).forEach(([via, itens]) => {
    pdfTexto(ctx, via, { size: 11, bold: true, gap: 3 });
    itens.forEach(i => {
      n++;
      if (ctx.y > 262) { doc.addPage(); ctx.y = 22; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
      const qtd = i.qtd || '', qw = qtd ? doc.getTextWidth(qtd) : 0;
      doc.splitTextToSize(`${n}. ${i.med}`, W - 2 * M - qw - 10).forEach((l, k) => {
        doc.setFont('helvetica', 'bold'); doc.text(l, M, ctx.y);
        if (k === 0 && qtd) {
          const lw = doc.getTextWidth(l);
          doc.setLineDashPattern([0.4, 1.2], 0); doc.setLineWidth(0.25); doc.line(M + lw + 2, ctx.y, W - M - qw - 2, ctx.y); doc.setLineDashPattern([], 0);
          doc.setFont('helvetica', 'normal'); doc.text(qtd, W - M, ctx.y, { align: 'right' });
        }
        ctx.y += 4.8;
      });
      if (i.posologia) pdfTexto(ctx, i.posologia, { size: 10.5, x: M + 5, gap: 4.5 }); else ctx.y += 3;
    });
    ctx.y += 2;
  });
  if (rx.orientacoes) { ctx.y += 2; pdfTexto(ctx, 'Orientações', { size: 10.5, bold: true, gap: 1 }); pdfTexto(ctx, rx.orientacoes, { size: 10.5 }); }
  pdfAssinatura(ctx, rx.data);
  concluirPdf(ctx, `receita-${slug(p.nome)}-${rx.data}.pdf`, imprimir);
}

// ---------- Financeiro: controle de caixa diário ----------
// Um documento por dia (id = data), com as linhas de recebimento separadas por forma de pagamento.
let caixaDia = TODAY, cx = null, cxSujo = false, cxTimer = null, cxExtra = 0;
const MIN_LINHAS = 21, PAGTOS = [['pix','Pix'],['cartao','Cartão'],['dinheiro','Dinheiro']];
const fmtBRL = v => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtNum = v => (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function parseValor(s) {
  s = String(s || '').replace(/[^\d,.-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
const linhaVazia = () => ({ cliente: '', procedimento: '', pix: 0, cartao: 0, dinheiro: 0 });
const totalLinha = l => (+l.pix || 0) + (+l.cartao || 0) + (+l.dinheiro || 0);
const linhaUsada = l => !!l && !!(String(l.cliente || '').trim() || String(l.procedimento || '').trim() || totalLinha(l) > 0);
const noCaixa = cid => S.caixa.some(c => (c.linhas || []).some(l => l.consultaId === cid));
const refrescarFin = () => { if (drawerPac && drawerTab === 'fin') abrirProntuario(drawerPac, drawerConsulta, 'fin'); };
function caixaDoDia(d) {
  const x = S.caixa.find(c => c.id === d);
  const c = x ? clone(x) : { id: d, responsavel: '', linhas: [], observacoes: '' };
  c.id = d; c.responsavel = c.responsavel || ''; c.observacoes = c.observacoes || '';
  c.linhas = (c.linhas || []).map(l => Object.assign(linhaVazia(), l));
  return c;
}
function totaisCaixa(c) {
  const t = { pix: 0, cartao: 0, dinheiro: 0 };
  c.linhas.forEach(l => PAGTOS.forEach(([k]) => { t[k] += +l[k] || 0; }));
  t.total = t.pix + t.cartao + t.dinheiro;
  return t;
}
function salvarCaixa() {
  clearTimeout(cxTimer); cxTimer = null;
  if (!cx || !cxSujo) return;
  cxSujo = false;
  const linhas = cx.linhas.slice();
  while (linhas.length && !linhaUsada(linhas[linhas.length - 1])) linhas.pop();
  const doc = { id: cx.id, responsavel: cx.responsavel, observacoes: cx.observacoes, linhas };
  const i = S.caixa.findIndex(c => c.id === cx.id); if (i >= 0) S.caixa[i] = clone(doc); else S.caixa.push(clone(doc));
  gravar('caixa', doc);
}
function sujar() { cxSujo = true; clearTimeout(cxTimer); cxTimer = setTimeout(salvarCaixa, 900); }
function mudarDiaCaixa(d) { salvarCaixa(); caixaDia = d; cx = null; cxExtra = 0; }

    </div>
    <div class="folha" id="folha">

      <div class="folha-info">
        <label>Data: <input type="date" id="cxData" value="${caixaDia}"></label>
        <label>Responsável: <input id="cxResp" value="${esc(cx.responsavel)}" placeholder="Quem fecha o caixa"></label>
      </div>
      <div class="table-wrap"><table class="cx">
        <thead><tr><th class="n">Nº</th><th>Nome da cliente</th><th>Procedimento</th><th class="w">Pix (R$)</th><th class="w">Cartão (R$)</th><th class="w">Dinheiro (R$)</th><th class="w">Total (R$)</th></tr></thead>
        <tbody>${cx.linhas.map((l, i) => `<tr>
          <td class="n">${i + 1}</td>
          <td><input id="cx-${i}-cliente" data-i="${i}" data-k="cliente" list="cxPac" value="${esc(l.cliente)}" aria-label="Nome da cliente, linha ${i + 1}"></td>
          <td><input id="cx-${i}-procedimento" data-i="${i}" data-k="procedimento" list="cxProc" value="${esc(l.procedimento)}" aria-label="Procedimento, linha ${i + 1}"></td>
          ${PAGTOS.map(([k, r]) => `<td><input class="r" id="cx-${i}-${k}" data-i="${i}" data-k="${k}" inputmode="decimal" value="${v(l[k])}" aria-label="${r}, linha ${i + 1}"></td>`).join('')}
          <td class="r tot" id="cx-t${i}">${v(totalLinha(l))}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <button class="btn ghost" data-a="cxLinha" style="margin-top:8px">${I.plus}Adicionar linhas</button>
      <h3 class="folha-sec">FECHAMENTO DO CAIXA</h3>
      <div class="fech">
        <div><span>Total Pix</span><b id="cxTpix">${fmtBRL(t.pix)}</b></div>
        <div><span>Total Cartão</span><b id="cxTcartao">${fmtBRL(t.cartao)}</b></div>
        <div><span>Total Dinheiro</span><b id="cxTdinheiro">${fmtBRL(t.dinheiro)}</b></div>
        <div class="geral"><span>TOTAL RECEBIDO</span><b id="cxTtotal">${fmtBRL(t.total)}</b></div>
      </div>

  folha.oninput = e => {
    const x = e.target;

    if (x.id === 'cxObs') { cx.observacoes = x.value; return sujar(); }
    const k = x.dataset.k; if (!k) return;
    const i = +x.dataset.i, l = cx.linhas[i];
    if (k === 'cliente' || k === 'procedimento') {
      l[k] = x.value;

    if (PAGTOS.some(([p]) => p === k)) { const val = cx.linhas[+x.dataset.i][k]; x.value = val ? fmtNum(val) : ''; }

function atualizarFech() {
  const t = totaisCaixa(cx);
  PAGTOS.forEach(([k]) => { $(`#cxT${k}`).textContent = fmtBRL(t[k]); });
  $('#cxTtotal').textContent = fmtBRL(t.total);
}

function pagarConsulta(cid) {
  const c = S.consultas.find(x => x.id === cid), p = pac(c.pacienteId) || { nome: '' };
  if (noCaixa(cid)) { mudarDiaCaixa(c.data); return go('financeiro'); }
  abrirAddCaixa({ data: c.data, cliente: p.nome, pacienteId: c.pacienteId, procedimento: tipoInfo(c.tipo).nome, consultaId: cid });
}
function abrirAddCaixa(pre) {
  let forma = 'pix';
  openModal(`${modalHead('Adicionar ao caixa', esc(fmtLongo(pre.data)))}
    <div class="card-body grid">
      <div><label class="f" for="acCli">Nome da cliente</label><input class="input" id="acCli" list="acPac" value="${esc(pre.cliente)}"><datalist id="acPac">${S.pacientes.map(p => `<option value="${esc(p.nome)}">`).join('')}</datalist></div>
      <div><label class="f" for="acProc">Procedimento</label><input class="input" id="acProc" value="${esc(pre.procedimento)}"></div>
      <div class="grid g2">
        <div><label class="f" for="acValor">Valor (R$)</label><input class="input" id="acValor" inputmode="decimal" value="${S.settings.valorConsulta ? esc(fmtNum(S.settings.valorConsulta)) : ''}" placeholder="0,00"></div>
        <div><label class="f">Forma de pagamento</label><div class="seg" id="acForma">${PAGTOS.map(([k, r]) => `<button data-v="${k}" class="${k === forma ? 'on' : ''}">${r}</button>`).join('')}</div></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="acOk">Adicionar ao caixa</button></div>`);
  setTimeout(() => $('#acValor')?.focus(), 60);
  $('#acForma').onclick = e => { const b = e.target.closest('button'); if (!b) return; forma = b.dataset.v; $('#acForma').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#acOk').onclick = () => {
    const valor = parseValor($('#acValor').value);
    if (!(valor > 0)) { toast('Informe o valor', 'erro'); return $('#acValor').focus(); }
    if (cx && cx.id === pre.data) salvarCaixa();
    const c = caixaDoDia(pre.data);
    c.linhas = c.linhas.filter(linhaUsada);
    const nome = $('#acCli').value.trim(), px = S.pacientes.find(p => p.nome.toLowerCase() === nome.toLowerCase());
    c.linhas.push(Object.assign(linhaVazia(), { cliente: nome, procedimento: $('#acProc').value.trim(), pacienteId: px ? px.id : (pre.pacienteId || ''), consultaId: pre.consultaId || '', [forma]: valor }));
    const i = S.caixa.findIndex(x => x.id === c.id); if (i >= 0) S.caixa[i] = clone(c); else S.caixa.push(clone(c));
    if (cx && cx.id === c.id) cx = null;
    gravar('caixa', c);
    closeModal(); render(); refrescarFin();
    toast(`Adicionado ao caixa de ${fmtDate(c.id)}`);
  };
}

function linhasDoPaciente(pid) {

}

function pdfCaixa(imprimir) {
  if (!window.jspdf) return toast('O gerador de PDF não carregou. Recarregue a página.', 'erro');
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' }), W = 210, M = 15;
  const linhas = cx.linhas.filter(linhaUsada), n = Math.max(MIN_LINHAS, linhas.length), t = totaisCaixa(cx);
  let y = 20;
  doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
  doc.text('CONTROLE DE CAIXA', W / 2, y, { align: 'center' }); y += 6;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.text('Consultório de Estética  |  Registro diário de recebimentos', W / 2, y, { align: 'center' }); y += 12;
  doc.setFontSize(10);
  doc.text('Data: ' + fmtDate(caixaDia), M + 2, y);
  doc.text('Responsável: ' + (cx.responsavel || '____________________________'), 112, y); y += 8;
  const cols = [[10, 'Nº', 'c'], [40, 'Nome da cliente', 'l'], [36, 'Procedimento', 'l'], [23, 'Pix (R$)', 'r'], [23, 'Cartão (R$)', 'r'], [24, 'Dinheiro (R$)', 'r'], [24, 'Total (R$)', 'r']];
  const hH = 8, rH = Math.max(5, Math.min(7, 150 / n));
  const cab = () => {
    doc.setFillColor(150, 117, 47); doc.rect(M, y, W - 2 * M, hH, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
    let x = M; cols.forEach(([w, r]) => { doc.text(r, x + w / 2, y + 5.2, { align: 'center' }); x += w; });
    y += hH; doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setDrawColor(210); doc.setLineWidth(0.2);
  };
  cab();
  for (let i = 0; i < n; i++) {
    if (y + rH > 282) { doc.addPage(); y = 15; cab(); }
    if (i % 2 === 0) { doc.setFillColor(245, 245, 245); doc.rect(M, y, W - 2 * M, rH, 'F'); }
    const l = linhas[i];
    const vals = [String(i + 1), l ? l.cliente : '', l ? l.procedimento : '', ...(l ? [l.pix, l.cartao, l.dinheiro, totalLinha(l)].map(v => v ? fmtNum(v) : '') : ['', '', '', ''])];
    let x = M;
    cols.forEach(([w, , al], k) => {
      doc.rect(x, y, w, rH);
      let s = vals[k];
      if (s) {
        if (al === 'l') s = doc.splitTextToSize(String(s), w - 3)[0];
        doc.setTextColor(k === 0 ? 140 : 30); doc.setFont('helvetica', k === 6 ? 'bold' : 'normal');
        doc.text(s, al === 'c' ? x + w / 2 : al === 'r' ? x + w - 1.5 : x + 1.5, y + rH / 2 + 1.1, { align: al === 'c' ? 'center' : al === 'r' ? 'right' : 'left' });
      }
      x += w;
    });
    y += rH;
  }
  y += 9; if (y > 245) { doc.addPage(); y = 20; }
  doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.text('FECHAMENTO DO CAIXA', M, y); y += 5;
  const bw = (W - 2 * M - 15) / 4;
  [['Total Pix', t.pix], ['Total Cartão', t.cartao], ['Total Dinheiro', t.dinheiro], ['TOTAL RECEBIDO', t.total]].forEach(([r, v], k) => {
    const bx = M + k * (bw + 5);
    doc.setFillColor(236, 236, 236); doc.roundedRect(bx, y, bw, 16, 2, 2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(40); doc.text(r, bx + bw / 2, y + 5.5, { align: 'center' });
    doc.setFont('helvetica', k === 3 ? 'bold' : 'normal'); doc.setFontSize(10.5); doc.setTextColor(20); doc.text(fmtBRL(v), bx + bw / 2, y + 12, { align: 'center' });
  });
  y += 24;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30);
  doc.text('Observações:', M, y);
  doc.splitTextToSize(cx.observacoes || '', W - 2 * M - 24).slice(0, 2).forEach((s, k) => doc.text(s, M + 23, y - 0.5 + k * 8));
  doc.setDrawColor(130); doc.line(M + 22, y + 1, W - M, y + 1); doc.line(M, y + 9, W - M, y + 9);
  doc.setFontSize(7.5); doc.setTextColor(110);
  doc.text('Controle interno  ·  Preencher uma linha por cliente e separar por forma de pagamento', W / 2, 288, { align: 'center' });
  concluirPdf({ doc }, `caixa-${caixaDia}.pdf`, imprimir);
}

      try {
        const d = JSON.parse(t); if (!d.pacientes || !d.settings) throw 0;
        confirmar('Restaurar os dados desta cópia neste computador? Itens iguais são atualizados; nada é apagado.', () => importar(d, true).then(() => { configMostrada = false; render(); }), 'Restaurar cópia');
      } catch { toast('Arquivo de cópia inválido', 'erro'); }
    });
  };
}
function salvarConfig() {
  const dias = [...document.querySelectorAll('#cDias input:checked')].map(i => +i.value);
  Object.assign(S.settings, { inicio: $('#cIni').value, fim: $('#cFim').value, dias, valorConsulta: parseValor($('#cValor').value) || 0 });
  Object.assign(S.settings.prof, { nome: $('#cNome').value.trim(), registro: $('#cReg').value.trim(), especialidade: $('#cEsp').value.trim(), telefone: $('#cTel').value.trim(), endereco: $('#cEnd').value.trim(), social: $('#cSoc').value.trim() });
  gravarConfig(); configMostrada = false; render(); toast('Configurações salvas');
}

render();
iniciar();
</script>
